# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8082}

# ── SQLite DataSource ────────────────────────────────────────────────────────
# In production (Railway), set DB_PATH env var to /data/marianna.db (persistent volume)
spring.datasource.url=jdbc:sqlite:${DB_PATH:marianna.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQLite does not support sequences; use identity generation
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# ── Application name ─────────────────────────────────────────────────────────
spring.application.name=marianna-dreams

# ── Security (admin endpoints) ───────────────────────────────────────────────
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:marianna2024}

# ── Gmail SMTP (for reply emails) ────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:mikjcantrell@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
